packages:
  - "apps/*"
  - "packages/*"

# Build scripts allowed to run (pnpm blocks them by default). `esbuild` and
# `workerd` need their native postinstall; everything else stays blocked.
# Added by pnpm during install to allow these pre-release packages past the
# minimum-release-age gate.
minimumReleaseAgeExclude:
  - miniflare@5.20261006.2-beta
  - wrangler@4.150.0
  - "@vue/compiler-core@3.5.44"
  - "@vue/compiler-dom@3.5.44"
  - "@vue/compiler-sfc@3.5.44"
  - "@vue/compiler-ssr@3.5.44"
  - "@vue/reactivity@3.5.44"
  - "@vue/runtime-core@3.5.44"
  - "@vue/runtime-dom@3.5.44"
  - "@vue/server-renderer@3.5.44"
  - "@vue/shared@3.5.44"
  - vue@3.5.44

allowBuilds:
  esbuild: true
  workerd: true

overrides:
  "zod": ">=4.6.6"
  "undici@>=8.0.0 <8.12.2": ">=8.12.2"
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
