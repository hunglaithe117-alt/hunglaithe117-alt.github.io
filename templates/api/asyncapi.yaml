# AsyncAPI 3.1 contract skeleton for the event-driven surface.
#
# Rename the resourceTopic channel, the ResourceCreated message, the
# ResourceEventPayload schema, the sendResourceCreated and receiveResourceCreated
# operations, and the broker and serviceAuth servers to the real domain names
# before use. A channel maps to a broker topic; a producer is a "send" operation
# and a consumer is a "receive" operation.

asyncapi: 3.1.0

info:
  title: "<ServiceName> Events"
  version: "0.1.0"
  description: |
    Replace this with the event-surface description. The reference UI
    (AsyncAPI Studio) renders from this file.

servers:
  broker:
    host: "broker.example.com:9092" # TODO: replace with the real broker host
    protocol: "<protocol>"
    protocolVersion: "<version>"
    description: "<the broker and environment this surface runs on>"
    security:
      - $ref: "#/components/securitySchemes/serviceAuth"

channels:
  resourceTopic:
    address: "<topic.name>"
    title: "<topic title>"
    messages:
      ResourceCreated:
        $ref: "#/components/messages/ResourceCreated"

operations:
  sendResourceCreated:
    action: send
    summary: "<producer: this service publishes the message>"
    channel:
      $ref: "#/channels/resourceTopic"
    messages:
      - $ref: "#/channels/resourceTopic/messages/ResourceCreated"
  receiveResourceCreated:
    action: receive
    summary: "<consumer: this service subscribes to the message>"
    channel:
      $ref: "#/channels/resourceTopic"
    messages:
      - $ref: "#/channels/resourceTopic/messages/ResourceCreated"

components:
  messages:
    ResourceCreated:
      name: ResourceCreated
      title: "<message title>"
      contentType: application/json
      headers:
        type: object
        properties:
          message_id:
            type: string
            format: uuid
            description: "<unique id of this message, for deduplication>"
          correlation_id:
            type: string
            description: "<id threading a request across producers and consumers>"
      payload:
        $ref: "#/components/schemas/ResourceEventPayload"
  schemas:
    ResourceEventPayload:
      type: object
      required:
        - id
        - occurred_at
        - event_type
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        event_type:
          type: string
  securitySchemes:
    serviceAuth:
      # Alternatives: userPassword, apiKey, X509, symmetricEncryption,
      # asymmetricEncryption, httpApiKey, http, oauth2, openIdConnect, plain,
      # scramSha512, gssapi.
      type: scramSha256
      description: "<how a producer or consumer authenticates to the broker>"
