# GraphQL SDL skeleton for the <ServiceName> surface.
#
# Rename the Resource type, its fields, and the operation names to the real
# domain model before use. Schema-evolution rules are at the end of this file.

"""An RFC 3339 timestamp, serialised as a string on the wire."""
scalar DateTime

type Query {
  "Fetch one resource by its identifier, or null when it does not exist."
  resource(id: ID!): Resource

  "List resources, newest first. Replace the pagination arguments as needed."
  resources(first: Int = 20, after: String): [Resource!]!
}

type Mutation {
  "Create a resource and return the stored object."
  createResource(input: CreateResourceInput!): Resource!

  "Archive a resource by identifier and return the updated object."
  archiveResource(id: ID!): Resource!
}

type Resource {
  id: ID!
  name: String!
  status: ResourceStatus!
  createdAt: DateTime!
}

input CreateResourceInput {
  name: String!
  status: ResourceStatus = ACTIVE
}

enum ResourceStatus {
  ACTIVE
  ARCHIVED
}

# Schema-evolution rules:
# - Add fields and enum values; never remove or rename one in place. Mark a
#   field @deprecated(reason: "...") and remove it only in a later major version.
# - Non-null is a promise: a nullable-to-non-null change is breaking, while a
#   non-null-to-nullable change is safe.
# - An input field is optional only when it has a default; adding a required
#   input field is a breaking change.
# - Every list element type must declare its nullability explicitly, as above.
