# Deploy — the single `cf` edge deployment (assets + Worker). Everything is served
# from Workers Static Assets; the Worker only attaches security headers.
#
# Fork-safe contract (TOOLCHAIN-VERIFIED.md §5):
#   * pull_request  -> credential-free `cf deploy --prebuilt --mode production --dry-run`.
#   * push to main  -> `deploy` job, gated by the `production-edge` GitHub Environment
#                      (required reviewers); only this job receives Cloudflare credentials.
#   * workflow_dispatch -> same gated deploy, for a deliberate re-deploy or rollback drill.
#
# Both jobs build the same pair: `apps/web/dist` with the real origin, then the
# edge artefact with `--mode production`. The mode must match the deploy or the
# pinned CLI rejects the prebuilt Build Output (P0-1).
#
# The asset directory comes from the sibling apps/edge/wrangler.config.ts (D-036),
# not cloudflare.config.ts.
name: deploy-edge

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight production deploy; serialize per ref.
  group: deploy-edge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # PR gate: validate the Build Output with NO credentials and NO network calls.
  validate:
    name: validate (dry-run, no credentials)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Deliberately no TURBO_TOKEN/TURBO_TEAM here: the PR path is credential-free.
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `PUBLIC_SITE_URL` is baked into canonical URLs, feeds, and the sitemap, so
      # it must be present here — an empty value silently falls back to
      # `https://example.com` (P0-2).
      - name: Build web
        run: pnpm turbo run build --filter=@blog/web
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_ANALYTICS_TOKEN: ${{ vars.PUBLIC_ANALYTICS_TOKEN }}

      # `cf build` packages apps/web/dist as assets and records the mode in the
      # Build Output; the deploy below must pass the same mode.
      - name: Build edge artefact
        working-directory: apps/edge
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: pnpm exec cf build --mode production

      # Credential-free: `--prebuilt --dry-run` validates the Build Output before
      # upload and makes no network call. Run from apps/edge (cf config search walks up).
      - name: cf deploy dry-run
        working-directory: apps/edge
        run: pnpm exec cf deploy --prebuilt --mode production --dry-run

  # Decide whether the edge deployment (or any of its inputs) actually changed.
  changes:
    name: detect edge changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      edge: ${{ steps.diff.outputs.edge }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes affecting apps/edge
        id: diff
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # First push / force-push: `before` is all zeroes -> deploy.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "edge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" \
            | grep -qE '^(apps/(edge|web)/|packages/|pnpm-lock\.yaml|turbo\.json)'; then
            echo "edge=true" >> "$GITHUB_OUTPUT"
          else
            echo "edge=false" >> "$GITHUB_OUTPUT"
          fi

  # Production deploy — reachable on push to main after the environment gate
  # (required reviewers) and only when the edge graph changed, or directly on
  # `workflow_dispatch` for a deliberate re-deploy or the rollback drill.
  deploy:
    name: deploy (production-edge)
    needs: changes
    if: |
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.changes.outputs.edge == 'true')
      )
    environment: production-edge # required reviewers; secrets exist only here
    runs-on: ubuntu-latest
    env:
      # Remote cache (optional); this job is the only one that receives credentials.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm turbo run build --filter=@blog/web
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_ANALYTICS_TOKEN: ${{ vars.PUBLIC_ANALYTICS_TOKEN }}

      # The account id is an identity input: `cf build` records it in the Build
      # Output, and `cf deploy --prebuilt` must resolve the same account (P0-3).
      - name: Build edge artefact
        working-directory: apps/edge
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: pnpm exec cf build --mode production

      # Destructive cf commands can abort with exit code 0 in CI — review the output.
      - name: Deploy (cf)
        working-directory: apps/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Same value as the build step: a deploy must never re-evaluate the config
          # with the hostname missing.
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: pnpm exec cf deploy --prebuilt --mode production
