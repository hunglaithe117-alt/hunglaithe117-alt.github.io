# CI — lint/test/build and content-quality gate.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push/commit supersedes the previous run for the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

jobs:
  ci:
    name: lint / test / build
    runs-on: ubuntu-latest
    steps:
      # Full history is required for `--filter=...[<ref>]` git filtering and for
      # Turborepo's hashing of changes since the base commit.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node 24.21.0 (floor >= 22.18 for cf config loading)
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- Content-quality gate (credential-free; safe for fork PRs) ---
      - name: Prettier (format check)
        run: pnpm format:check

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            **/*.mdx

      - name: Vale (prose, error level)
        uses: errata-ai/vale-action@v2
        with:
          files: .
          vale_flags: "--minAlertLevel=error"
          # `local` reporter keeps this fork-safe: no PR-comment write needed.
          reporter: local
          filter_mode: nofilter
          fail_on_error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Astro check
        run: pnpm --filter @blog/web check

      # --- Workspace lint, test, and build ---
      - name: Lint & test workspace
        run: |
          pnpm -r lint
          pnpm -r test

      - name: Build web
        run: pnpm --filter @blog/web build

      - name: Lychee (offline link check)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir apps/web/dist "apps/web/dist/**/*.html"
          fail: true

  security:
    name: secret & dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: gitleaks — full-history secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: pnpm audit (high/critical gate)
        run: pnpm security:audit
