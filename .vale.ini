# Vale prose config — content-quality gate.
#
# Only `minAlertLevel = error` blocks the build; suggestions/warnings stay advisory.
StylesPath = styles
MinAlertLevel = error
Packages = Google, write-good

# Treat MDX as Markdown (Vale has no native MDX format).
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Google, write-good
