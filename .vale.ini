# Vale prose config — content-quality gate (D-027).
#
# Only `minAlertLevel = error` blocks the build; suggestions/warnings stay advisory.
# `StylesPath` must exist. It currently holds only the README (no third-party
# packages), so `vale sync` is a no-op and the gate works offline. Add styles by
# declaring `Packages = ...` here and running `vale sync`.
StylesPath = styles
MinAlertLevel = error

# Treat MDX as Markdown (Vale has no native MDX format).
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale
